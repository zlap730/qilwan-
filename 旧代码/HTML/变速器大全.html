    <header id="header1" style="opacity: 0.9;background-color: bisque;width: 80%;margin: auto;height: 1600px;margin-top: 60px;">
        
        <div class="container">
            <!-- 可以自由设置初始位置 -->
            <img src="../img/2公路车图片.jpg" class="sliding-image" style="width: 120px; top: 50px; left: 100px;">
            <img src="../img/00.jpg" class="sliding-image" style="width: 150px; top: 150px; left: 300px;">
            <img src="../img/AM山地车.jpg" class="sliding-image" style="width: 100px; top: 250px; left: 500px;">
            <img src="" class="sliding-image" style="width: 120px; top: 350px; left: 700px;">
        </div>
          <script>
            const container = document.querySelector('.container');
            const images = document.querySelectorAll('.sliding-image');
            const containerWidth = container.offsetWidth;
            const speed = 80; // 像素/秒
            
            let lastTime = performance.now();
            
            function animate(currentTime) {
              const deltaTime = (currentTime - lastTime) / 1000; // 转换为秒
              
              images.forEach(img => {
                const imgWidth = img.offsetWidth;
                let currentLeft = parseFloat(img.style.left) || 0;
                
                // 计算新位置
                currentLeft += speed * deltaTime;
                
                // 当图片完全移出右侧时重置到左侧
                if (currentLeft > containerWidth) {
                  currentLeft = -imgWidth;
                  img.style.transition = 'none'; // 禁用过渡效果
                  requestAnimationFrame(() => {
                    img.style.left = `${currentLeft}px`;
                    img.style.transition = ''; // 恢复过渡
                  });
                } else {
                  img.style.left = `${currentLeft}px`;
                }
              });
            
              lastTime = currentTime;
              requestAnimationFrame(animate);
            }
            
            requestAnimationFrame(animate);
            </script>
