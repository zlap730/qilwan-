            <h2>气动架全名为："空气动力学公路自行车"</h2>
            <p>这类自行车通常采用特殊的管型和车身形状，以减少风阻。例如，捷安特(Giant)发布的全新Propel Disc系列，<br>通过在法国ACE风洞实验室Magny-Cours进行三年的设计、开发和测试，打造了前沿的空气动力学公路自行车</p>
            <p>破风公路车往往将车架、轮组和其他组件作为一个整体系统来设计，以确保各部分协同工作，以达到最佳的空气动力学效果<br>现代破风公路车通常配备碟刹，以提供更好的制动力和操控性，同时也考虑到空气动力学性能</p>
            <p>破风公路车是自行车科技领域的一项重要进步，它通过综合考虑空气动力学、材料科学和工程设计，为骑行者提供了在公路上<br>更高效、更快速的骑行体验。随着技术的不断发展，未来的破风公路车有望继续在性能上取得突破。</p>
            <video src="img/下载.mp4" controls loop autoplay muted></video>
        </div>
        <div class="div-2" id="id2">
                <h2>长途耐力公路自行车</h2>
                <p>耐力公路车是为了长距离骑行而设计的自行车，它们通常具有更宽松的车身几何结构和更宽的轮胎间隙，以提供更多的舒适性和操控性。<br>这些自行车适合在多种路况下骑行，包括城市街道、乡村道路以及一些越野环境。耐力公路车通常不具备竞赛公路车那样的空气动力学<br>特性，而是更多地关注骑行者的舒适度和耐久性</p>
                <p>舒适性：这类自行车通常配备有减震系统，如Trek的IsoSpeed技术，以减少路面震动对骑行者的影响</p>
                <p>几何设计：这类自行车的几何设计通常更注重骑行者的舒适姿态，提供更直立的骑行位置，减少腰背、肩膀和颈部的疲劳</p>
                <img src="img/捷安特DF.jpg" alt="" id="img-tiaozheng">
        </div> 
        <div class="div-3" id="id3">

            <p>爬坡公路车是为爬坡性能而设计的自行车，它们通常具有更轻的车架、更窄的轮胎和更优化的齿轮比例，这些特点使得<br>公路车在平坦的铺装路面上具有更好的性能。爬坡公路车的设计注重速度和效率，它们拥有更轻的车架、更窄的轮胎和<br>更优化的齿轮比例，这些特点使得公路车在平坦的铺装路面上具有更好的性能</p>
            <p>轻量化设计：爬坡时需要对抗重力，因此爬坡车通常会做得更轻，以减少重力带来的阻力。</p>
            <p>几何结构：爬坡车的几何设计通常更注重骑行者的舒适姿态，提供更直立的骑行位置，减少腰背、肩膀和颈部的疲劳</p>
            <p>耐用性：虽然爬坡车强调轻量化，但也需要足够的耐用性来应对爬坡过程中的高强度使用。</p>
