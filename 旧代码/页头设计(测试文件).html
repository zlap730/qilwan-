<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #nav_1{
        width: 1900px;
        height: 60px;
        background-color:rgb(236, 215, 156);
    }
    #ul_nav{
        list-style: none;
        display: inline-flex;
        position: relative;
        
    }
    #ul_nav li{
        margin-left: 30px;
        font-size: 20px;
        font-family: "微软雅黑";
        font-weight: bold;
    }
    a{
        text-decoration: none;
    }

    /* 列表项设置 */
    li a{
        color: white;
        text-shadow: 
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        1px 1px 0 #000;
    }
    
    /* 导航图片logo设置 */
    #img_nav{
        width: 100px;
        height: 55px;
        position: relative;
        float: right;
        right: 10px;
        top: 2px;
    }

</style>
<body>
    <nav id="nav_1">
        <ul id="ul_nav">
            <!-- 链接对应网页链接 -->
            <li><a href="">山地车</a></li>
            <li><a href="">公路车</a></li>
            <li><a href="">配件</a></li>
            <li><a href="">服装头盔</a></li>
            <li><a href="">装配计算器</a></li>
            <li><a href="">关于网站</a></li>  
        </ul>
         <a href=""><img src="img/logo.jpg" alt="logo" id="img_nav"></a> <!--链接关于网站的html -->
    </nav>
</body>
</html>
