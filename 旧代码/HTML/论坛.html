    <section style="width: 80%;height: 700px;background-color: rgba(255, 228, 196, 0.95);margin: auto;"> 
        <h1>讨论区</h1>
        <div class="comments-section">
            <div class="commentsContainer">
                <!-- 后端的评论将显示在这里 -->
            </div>
        </div>
    </section>

    <div class="comment-bar">
        <button class="toggleCommentButton">添加评论</button>
        <div class="commentForm" style="display: none;">
            <textarea class="commentInput" placeholder="在这里输入你的评论"></textarea>
            <input type="file" class="commentImageInput" accept="image/*" value="上传图片">
            <button class="submitButton">提交评论</button>
        </div>
    </div>

        <!-- 模态框 -->
        <div id="myModal" class="modal">
            <span class="close">&times;</span>
            <div class="modal-content">
                <img id="img01" alt="Comment Image">
            </div>
        </div>

    <script src="../JS文件/评论区代码.js"></script>
