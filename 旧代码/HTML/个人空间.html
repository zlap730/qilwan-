    <div class="container">
        <h2>我的空间</h2>

        <!-- 发布作品区域 -->
        <div id="publishSection">
            <h3>发布作品</h3>
            <button id="showUploadFormButton" onclick="showUploadForm(event)">上传作品</button>
            <form id="postForm" enctype="multipart/form-data" onsubmit="uploadPost(event)" style="display:none; margin-top: 15px;">
                <textarea id="postContent" name="content" placeholder="写下你的作品内容..." rows="5"></textarea>
                <input type="file" id="postFile" name="file" accept="image/*,video/*">
                <button type="submit" id="uploadButton">确认上传</button>
            </form>
        </div>

        <hr>

        <!-- 展示作品区域 -->
        <div id="postsSection">
            <h3>作品展示</h3>
            <!-- 动态加载作品 -->
        </div>
    </div>

    <script src="../JS文件/个人空间.js"></script>
    <script>
    function showUploadForm(event) {
        event.preventDefault();
        document.getElementById('showUploadFormButton').style.display = 'none';
        document.getElementById('postForm').style.display = 'block';
    }
    </script>
