<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css文档/登陆页面css.css">
    <link rel="icon" href="/img/iocioc.ioc" type="image/x-icon">
    <title>登陆账号</title>
</head>
<body bgcolor="bisque">
    <video src="/video/我们为何如此热爱骑行？丨电影感短片_ City Finder.mp4" autoplay loop muted="true" id="ck"></video>
    <div id="登录窗口">
        <h2>登录</h2>
        <input type="text" id="user" placeholder="账号" class="input_text">
        <input type="password" id="password" placeholder="密码" class="input_text">
        <button onclick="login()" id="but_join">登录</button>
        <a href="#" id="registerLink" class="zc">注册</a>
    </div>
    <div id="注册窗口" style="display: none;">
        <h2>注册账号</h2>
        <input type="text" id="newUser" placeholder="账号" class="zc_text">
        <input type="password" id="newPassword" placeholder="密码" class="zc_text">
        <input type="password" id="confirmPassword" placeholder="确认密码" class="zc_text">
        <input type="email" id="email" placeholder="邮箱" class="zc_text">
        <button onclick="register()" class="zcc">注册</button>
        <a href="#" id="loginLink" class="zc">返回登录</a>
    </div>

    
    <script>
        // 页面加载时检查用户是否已登录
        document.addEventListener('DOMContentLoaded', () => {
            const userCookie = document.cookie.split('; ').find(row => row.startsWith('user='));
            const user = userCookie ? JSON.parse(decodeURIComponent(userCookie.split('=')[1])) : null;

            if (user) {
                console.log('用户已登录:', user); // 调试信息
                window.location.href = '/HTML/选择页面.html'; // 跳转到选择页面
            }
        });

        async function login() {
            const identifier = document.getElementById('user').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', { // 确保路径正确
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '登录失败');
                }

                const data = await response.json();
                sessionStorage.setItem('token', data.token); // 存储 JWT 令牌到 sessionStorage
                document.cookie = `user=${encodeURIComponent(JSON.stringify(data.user))}; path=/; max-age=604800`; // 设置持久化 Cookie，7 天有效
                window.location.href = data.redirect; // 跳转到选择页面
            } catch (error) {
                alert(error.message);
            }
        }

        async function register() {
            const username = document.getElementById('newUser').value.trim();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value.trim();

            if (!username || !password || !email) {
                alert('请输入用户名、密码和邮箱');
                return;
            }

            if (username.length < 2 || username.length > 30) {
                alert('用户名长度应为2-30个字符');
                return;
            }

            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                alert('用户名只能包含字母、数字和下划线');
                return;
            }

            if (password.length < 6) {
                alert('密码长度至少6位');
                return;
            }

            if (password !== confirmPassword) {
                alert('两次输入的密码不一致，请重试');
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert('请输入正确的邮箱地址');
                return;
            }

            const scriptPattern = /<\/?\s*script\b[^>]*>/gi;
            if (scriptPattern.test(username) || scriptPattern.test(email)) {
                alert('输入内容包含非法脚本，请检查重试');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/auth/register', { // 确保路径正确
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email }) // 移除 bio 字段
                });

                if (!response.ok) {
                    const errorBody = await response.json().catch(() => ({}));
                    const message = errorBody.error || errorBody.message || '注册失败（400）';
                    let detail = '';
                    if (errorBody.details) {
                        detail = Array.isArray(errorBody.details)
                            ? `：${errorBody.details.join('，')}`
                            : `：${typeof errorBody.details === 'object' ? JSON.stringify(errorBody.details) : errorBody.details}`;
                    }
                    throw new Error(`${message}${detail}`);
                }

                alert('注册成功，请登录');
                document.getElementById('注册窗口').style.display = 'none';
                document.getElementById('登录窗口').style.display = 'block';
            } catch (error) {
                console.error('注册失败详细信息', error);
                alert(error.message);
            }
        }

        // 切换窗口
        document.getElementById('registerLink').addEventListener('click', () => {
            document.getElementById('登录窗口').style.display = 'none';
            document.getElementById('注册窗口').style.display = 'block';
        });

        document.getElementById('loginLink').addEventListener('click', () => {
            document.getElementById('注册窗口').style.display = 'none';
            document.getElementById('登录窗口').style.display = 'block';
        });
    </script>
</body>
</html>
