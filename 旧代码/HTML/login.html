<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="/css文档/login.css"> <!-- 确保路径正确 -->
</head>
<body>
    <div class="container">
        <h2>登录</h2>
        <form id="loginForm">
            <label for="identifier">用户名或邮箱:</label>
            <input type="text" id="identifier" name="identifier" required>

            <label for="password">密码:</label>
            <input type="password" id="password" name="password" required>

            <button type="button" onclick="login()">登录</button>
        </form>
    </div>
    <script>
        // 页面加载时检查用户是否已登录
        document.addEventListener('DOMContentLoaded', () => {
            const userCookie = document.cookie.split('; ').find(row => row.startsWith('user='));
            const user = userCookie ? JSON.parse(decodeURIComponent(userCookie.split('=')[1])) : null;

            if (user) {
                console.log('用户已登录:', user); // 调试信息
                window.location.href = '/HTML/选择页面.html';
            }
        });

        async function login() {
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', { // 确保路径正确
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '登录失败');
                }

                const data = await response.json();
                document.cookie = `user=${encodeURIComponent(JSON.stringify(data.user))}; path=/; max-age=3600`; // 设置持久化 Cookie
                sessionStorage.setItem('token', data.token); // 保存 JWT 令牌
                window.location.href = data.redirect; // 跳转到选择页面
            } catch (error) {
                alert(error.message);
            }
        }
    </script>
</body>
</html>
